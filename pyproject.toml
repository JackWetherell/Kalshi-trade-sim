[project]
name = "kalshi-edge"
version = "0.1.0"
description = "Research, backtest and paper/demo trading system for Kalshi binary markets (live trading disabled by default)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "cryptography>=42",
    "websockets>=12,<16",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "matplotlib>=3.8,<4",
]

[project.scripts]
kalshi-edge = "kalshi_edge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "demo: requires human-provisioned Kalshi DEMO credentials and network (skipped by default)",
    "network: requires outbound network to public Kalshi endpoints (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kalshi_edge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*", "pyarrow.*"]
ignore_missing_imports = true
