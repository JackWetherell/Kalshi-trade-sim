# Backtest configuration. Deterministic given seed + data + config.
# dataset: synthetic => engine-validation data generated by a seeded simulator.
#   Synthetic results are NOT evidence of real-market edge (see docs/RESULTS.md).
# dataset: recorded => replay of order-book snapshots captured by `kalshi-edge data record`.
mode: backtest
strategy_capital: "1009"
strategy:
  id: positive-ev-80          # overridden by --strategy on the CLI
  sizing: kelly
  naive_notional: "10"
  scaled_min_risk: "2"
  scaled_max_risk: "10"
  fixed_risk: "5"
  slippage_buffer: "0.005"
risk:
  per_entry_max_loss_frac: "0.01"
  aggregate_open_loss_frac: "0.10"
  cluster_loss_frac: "0.05"
  daily_stop_frac: "0.03"
  weekly_stop_frac: "0.06"
  max_drawdown_frac: "0.10"
  max_orders_per_day: 10
  min_price_exclusive: "0.80"
  max_price: "0.97"
  min_edge: "0.02"
  kelly_fraction: "0.10"
  min_depth_notional: "25"
  max_spread: "0.05"
  max_book_age_seconds: 3.0
  min_seconds_to_close: 7200
  category_allowlist: ["weather", "economics"]
fees:
  taker_rate: "0.07"
  rounding_increment: "0.01"
exchange:
  environment: none
paths:
  state_dir: var/backtest
backtest:
  dataset: synthetic
  seed: 20261012
  n_events: 600
  start: "2025-01-01"
  days: 360
  decision_interval_minutes: 60
  order_latency_seconds: 2.0
  holdout_fraction: "0.3"
